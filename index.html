<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Quick Paste to Spreadsheet</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700&family=Quicksand:wght@500;700&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div class="container">
      <h2>PART LIST to SPREADSHEET</h2>

      <textarea id="rawInput" placeholder="Paste your part list here..."></textarea>
      <br />
      <button style="width: 100%;" id="sendBtn" onclick="processAndSend()">Process</button>
      <div id="status"></div>

      <a
        href="https://docs.google.com/spreadsheets/d/15kXzxD1ZtcdIV206ks-LLlgQadGvymjrUBe_uagu4Lw/edit?usp=sharing"
        target="_blank"
        style="text-decoration: none"
      >
        <button style="width: 100%; margin-top: 1px; background-color: #fff; border-color: #4caf50; border-width: 1px; border-style: solid; color: #4caf50; border: 1px solid #4caf50; padding: 10px; font-size: 16px; cursor: pointer;">
          Open Spreadsheet
        </button>
      </a>
<p
        style="
          position: fixed;
          bottom: 20px;
          right: 50px;
          opacity: 0.5;
          font-size: 12px;
          color: gray;
        "
      >
        Credit: github.com/DaniEkaQwerty
      </p>
    </div>

    <script src="script.js"></script>

  </body>
</html>
